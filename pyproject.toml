[project]
name = "prime-testing"
version = "1.0.0"
description = "Primality tests from scratch: trial division, Fermat, Miller-Rabin, Carmichael numbers and a toy RSA"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.9",
    "numpy>=2.0",
    "seaborn>=0.13",
]

[project.scripts]
prime-testing = "prime_testing.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prime_testing"]

[tool.pytest.ini_options]
testpaths = ["tests"]
